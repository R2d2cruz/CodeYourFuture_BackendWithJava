<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="ISO-8859-1">
    <title>Modificar Autor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-0evHe/X+R7YkIZDRvuzKMRqM+OrBnVFBL6DOitfPri4tjfHxaWutUpFmBp4vmVor" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/formulario.css">
</head>

<body>

    <div th:replace="~{fragments/nav_bar.html}"></div>

    <!-- Mensajes de error o éxito -->
    <div th:if="${error != null}" class="card text-white bg-danger mb-3 mensajeError">
        <div class="card-body">
            <h5 class="card-title">Error 👎</h5>
            <p class="card-text" th:text="${error}"></p>
        </div>
    </div>
    <div th:if="${exito != null}" class="card text-white bg-success mb-3 mt-3 mensajeExito">
        <div class="card-body">
            <h5 class="card-title">¡Éxito!</h5>
            <p class="card-text" th:text="${exito}"></p>
        </div>
    </div>

    <div class="container-fluid m-5 contenedor">
        <form class="formulario" th:action="@{/libro/{isbn}(isbn=${libro.isbn})}" method="POST">
            <!-- ISBN, Titulo y Ejemplares -->
            <div class="form-group my-3">
                <label class="mb-2">ISBN</label>
                <input type="number" class="form-control" name="isbn" th:value="${libro != null ? libro.isbn : ''}"
                    placeholder="ISBN" readonly>
            </div>

            <div class="form-group my-3">
                <label class="mb-2">Título del Libro</label>
                <input type="text" class="form-control" name="titulo" th:value="${libro != null ? libro.titulo : ''}"
                    placeholder="Título del Libro">
            </div>

            <div class="form-group my-3">
                <label class="mb-2">Cantidad de Ejemplares</label>
                <input type="number" class="form-control" name="ejemplares"
                    th:value="${libro != null ? libro.ejemplares : ''}" placeholder="Cantidad de Ejemplares">
            </div>

            <!-- Select Autor -->
            <div class="form-group my-3">
                <label class="mb-2">Seleccionar Autor</label>
                <select name="idAutor" class="form-control">
                    <option th:each="autor : ${autores}" th:value="${autor.id}" th:text="${autor.nombre}"
                        th:selected="${libro != null && libro.autor != null && libro.autor.id == autor.id}">
                        <!-- Directa comparación -->
                    </option>
                </select>
            </div>

            <!-- Select Editorial -->
            <div class="form-group my-3">
                <label class="mb-2">Seleccionar Editorial</label>
                <select name="idEditorial" class="form-control">
                    <option th:each="editorial : ${editoriales}" th:value="${editorial.id}"
                        th:text="${editorial.nombre}"
                        th:selected="${libro != null && libro.editorial != null && libro.editorial.id == editorial.id}">
                        <!-- Directa comparación -->
                    </option>
                </select>
            </div>


            <button type="submit" class="btn btn-primary mt-3 botones">Guardar</button>
        </form>

        <section class="text-center container">
            <div class="row mt-3">
                <div class="divVolver">
                    <a th:href="@{/}" class="btn btn-secondary my-2 botonVolver botones">Volver</a>
                </div>
            </div>
        </section>
    </div>


    <footer class="text-muted py-5">
        <div class="containerFooter">
            <p class="mb-1">Este es un ejemplo de Bootstrap. Personaliza el diseño a tu gusto.</p>
            <p class="mb-0">¿Nuevo en Bootstrap? <a href="/"><br>Visita la página principal</a> o lee nuestra <a
                    href="../getting-started/introduction/">guía de introducción</a>.</p>
            <p class="float-end mb-1">
                <a href="#" style="text-decoration:none"><span>⬆️</span> Volver arriba</a>
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2"
        crossorigin="anonymous"></script>
</body>

</html>
